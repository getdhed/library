basePath: /api
definitions:
  domain.AuthPayload:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  domain.Document:
    properties:
      author:
        type: string
      coverPath:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      executor:
        type: string
      fileName:
        type: string
      fileSizeBytes:
        type: integer
      id:
        type: integer
      isFavorite:
        type: boolean
      mimeType:
        type: string
      periodicalName:
        type: string
      placeOfPublication:
        type: string
      publisher:
        type: string
      scientificAdvisor:
        type: string
      similarity:
        type: number
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
      updatedAt:
        type: string
      volume:
        type: string
      year:
        type: integer
    type: object
  domain.DocumentSubmission:
    properties:
      approvedDocumentId:
        type: integer
      author:
        type: string
      comment:
        type: string
      coverPath:
        type: string
      createdAt:
        type: string
      description:
        type: string
      executor:
        type: string
      fileName:
        type: string
      fileSizeBytes:
        type: integer
      id:
        type: integer
      mimeType:
        type: string
      moderationNote:
        type: string
      periodicalName:
        type: string
      placeOfPublication:
        type: string
      publisher:
        type: string
      reviewedAt:
        type: string
      reviewedBy:
        type: integer
      reviewerName:
        type: string
      reviewerUsername:
        type: string
      scientificAdvisor:
        type: string
      source:
        $ref: '#/definitions/domain.SubmissionSource'
      status:
        $ref: '#/definitions/domain.SubmissionStatus'
      tags:
        type: string
      title:
        type: string
      type:
        type: string
      updatedAt:
        type: string
      uploaderName:
        type: string
      uploaderUsername:
        type: string
      userId:
        type: integer
      volume:
        type: string
      year:
        type: integer
    type: object
  domain.HomePayload:
    properties:
      favorites:
        items:
          $ref: '#/definitions/domain.Document'
        type: array
      recent:
        items:
          $ref: '#/definitions/domain.Document'
        type: array
      searchHistory:
        items:
          $ref: '#/definitions/domain.SearchHistoryItem'
        type: array
    type: object
  domain.LoginInput:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  domain.PagedDocuments:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Document'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  domain.RegisterInput:
    properties:
      fullName:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  domain.SearchHistoryItem:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      query:
        type: string
    type: object
  domain.SubmissionSource:
    enum:
    - user_upload
    - admin_import
    type: string
    x-enum-varnames:
    - SubmissionSourceUserUpload
    - SubmissionSourceAdminImport
  domain.SubmissionStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - SubmissionStatusPending
    - SubmissionStatusApproved
    - SubmissionStatusRejected
  domain.User:
    properties:
      avatarUrl:
        type: string
      createdAt:
        type: string
      fullName:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      role:
        $ref: '#/definitions/domain.UserRole'
      updatedAt:
        type: string
      username:
        type: string
    type: object
  domain.UserRole:
    enum:
    - user
    - admin
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
host: localhost:8080
info:
  contact:
    email: support@library.local
    name: API Support
  description: Backend API for the Library application.
  termsOfService: http://swagger.io/terms/
  title: Library API
  version: "1.0"
paths:
  /admin/documents:
    get:
      description: Retrieve a paginated list of all documents including unapproved
        ones
      parameters:
      - description: Search query
        in: query
        name: query
        type: string
      - description: Document type
        in: query
        name: type
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PagedDocuments'
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List documents (Admin)
      tags:
      - admin
    post:
      consumes:
      - multipart/form-data
      description: Upload a file and create a document directly bypassing moderation
      parameters:
      - description: Document file (PDF)
        in: formData
        name: file
        required: true
        type: file
      - description: Document title
        in: formData
        name: title
        required: true
        type: string
      - description: Document type
        in: formData
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Document'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create document (Admin)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return JWT
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthPayload'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user in the system
      parameters:
      - description: Registration info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthPayload'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register new user
      tags:
      - auth
  /catalog/document-types:
    get:
      description: Get available document types
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List document types
      tags:
      - public
  /catalog/documents:
    get:
      description: Retrieve a paginated list of documents with filters
      parameters:
      - description: Search query
        in: query
        name: query
        type: string
      - description: Document type
        in: query
        name: type
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PagedDocuments'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List documents
      tags:
      - documents
  /catalog/documents/{id}:
    get:
      description: Retrieve details of a specific document by ID
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Document'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get document details
      tags:
      - documents
  /catalog/documents/{id}/cover:
    get:
      description: Retrieve the generated cover image for a document
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get document cover image
      tags:
      - documents
  /catalog/documents/{id}/favorite:
    delete:
      description: Remove a document from favorites
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unfavorite a document
      tags:
      - profile
    post:
      description: Add a document to favorites
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Favorite a document
      tags:
      - profile
  /catalog/documents/{id}/file:
    get:
      description: Get the raw PDF file for a document
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: Set to 1 to force download
        in: query
        name: download
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Download/View document file
      tags:
      - documents
  /catalog/submissions:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file and submit it for moderation
      parameters:
      - description: Document file (PDF)
        in: formData
        name: file
        required: true
        type: file
      - description: Document title
        in: formData
        name: title
        required: true
        type: string
      - description: Document type
        in: formData
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DocumentSubmission'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit a new document
      tags:
      - documents
  /catalog/submissions/{id}:
    get:
      description: Retrieve details of a document submission by ID
      parameters:
      - description: Submission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DocumentSubmission'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get submission details
      tags:
      - documents
  /catalog/submissions/{id}/file:
    get:
      description: Get the raw PDF file for a submission
      parameters:
      - description: Submission ID
        in: path
        name: id
        required: true
        type: integer
      - description: Set to 1 to force download
        in: query
        name: download
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Download/View submission file
      tags:
      - documents
  /catalog/suggest:
    get:
      description: Get auto-complete suggestions based on query
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search suggestions
      tags:
      - public
  /home:
    get:
      description: Retrieves recent documents, favorites, and search history for the
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HomePayload'
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get homepage data
      tags:
      - public
  /me:
    get:
      description: Retrieve the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
