services:
  db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    image: library-backend:2026-07-13
    build:
      context: ./backend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - ./backend/storage/**
            - ./backend/.cache/**
            - ./backend/.git/**
    restart: always
    environment:
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://library:library@db:5432/library?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Администратор}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    image: library-frontend:2026-07-13
    build:
      context: ./frontend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - ./frontend/node_modules/**
            - ./frontend/dist/**
            - ./frontend/.git/**
    restart: always
    environment:
      BACKEND_PROXY_TARGET: ${BACKEND_PROXY_TARGET:-http://backend:8080}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
