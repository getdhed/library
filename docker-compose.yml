services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - ./backend/storage/**
            - ./backend/.cache/**
            - ./backend/.git/**
    restart: unless-stopped
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://library:library@db:5432/library?sslmode=disable
      JWT_SECRET: super-secret-local-key
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: "*"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_NAME: Администратор
      SEED_ADMIN_PASSWORD: admin12345
    ports:
      - "8080:8080"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - ./frontend/node_modules/**
            - ./frontend/dist/**
            - ./frontend/.git/**
    restart: unless-stopped
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
      VITE_API_URL: /api
      VITE_BACKEND_URL: ""
    ports:
      - "80:5173"
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
